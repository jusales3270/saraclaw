services:
  - type: web
    name: saraclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: SARACLAW_STATE_DIR
        value: /data/.saraclaw
      - key: SARACLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: SARACLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: saraclaw-data
      mountPath: /data
      sizeGB: 1

